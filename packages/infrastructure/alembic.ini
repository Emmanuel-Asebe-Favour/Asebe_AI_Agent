# Alembic configuration for the infrastructure package.
#
# Run it from the repository root:
#   uv run alembic -c packages/infrastructure/alembic.ini upgrade head
#
# The database URL is deliberately NOT here. env.py reads DATABASE_URL from the environment or
# from the git-ignored .env at the repository root, so no password is ever committed.
[alembic]
script_location = %(here)s/alembic
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
