[project]
name = "asebe-infrastructure"
version = "0.0.0"
description = "SQLAlchemy models, repositories, S3, email and HTTP clients. Implements domain protocols."
requires-python = ">=3.12,<3.13"

# This is the package AGENTS.md §5 designates as the implementer of the protocols the domain
# defines. It is where SQLAlchemy, httpx and Procrastinate are allowed to live.
dependencies = [
    "asebe-domain",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    "httpx>=0.27,<1",
    "procrastinate>=2.9,<3",
    "pydantic-settings>=2.6,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asebe_infrastructure"]
